<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px;
    }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45);
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .header-left h1 {
      color: #fff;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .header-left p {
      color: rgba(255,255,255,0.45);
      font-size: 0.85rem;
      margin-top: 3px;
    }

    .stats {
      background: rgba(233,69,96,0.15);
      border: 1px solid rgba(233,69,96,0.3);
      border-radius: 50px;
      padding: 6px 16px;
      color: #e94560;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ── Input row ── */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-row input[type="text"] {
      flex: 1;
      padding: 13px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }
    .input-row input::placeholder { color: rgba(255,255,255,0.25); }
    .input-row input:focus {
      border-color: #e94560;
      background: rgba(255,255,255,0.10);
      box-shadow: 0 0 0 3px rgba(233,69,96,0.20);
    }

    .btn-add {
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 16px rgba(233,69,96,0.35);
      line-height: 1;
    }
    .btn-add:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-add:active { transform: translateY(0); }

    /* ── Priority selector ── */
    .priority-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .priority-row label {
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      align-self: center;
      white-space: nowrap;
    }

    .prio-btn {
      flex: 1;
      padding: 7px 0;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: rgba(255,255,255,0.45);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .prio-btn:hover { background: rgba(255,255,255,0.07); }
    .prio-btn.active[data-prio="low"]    { background: rgba(39,174,96,0.2);  border-color: #27ae60; color: #2ecc71; }
    .prio-btn.active[data-prio="medium"] { background: rgba(241,196,15,0.2); border-color: #f1c40f; color: #f1c40f; }
    .prio-btn.active[data-prio="high"]   { background: rgba(233,69,96,0.2);  border-color: #e94560; color: #e94560; }

    /* ── Filter tabs ── */
    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }

    .filter-btn {
      flex: 1;
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .filter-btn:hover { background: rgba(255,255,255,0.06); }
    .filter-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }

    /* ── Task list ── */
    #taskList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #taskList::-webkit-scrollbar { width: 4px; }
    #taskList::-webkit-scrollbar-track { background: transparent; }
    #taskList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: rgba(255,255,255,0.25);
    }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 10px; }
    .empty-state p { font-size: 0.9rem; }

    /* ── Task item ── */
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      transition: background 0.2s, opacity 0.25s, transform 0.2s;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover { background: rgba(255,255,255,0.08); }
    .task-item.done  { opacity: 0.45; }

    /* custom checkbox */
    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background 0.2s;
      font-size: 12px;
    }
    .task-check:hover { border-color: #27ae60; }
    .task-item.done .task-check {
      background: #27ae60;
      border-color: #27ae60;
    }

    /* priority dot */
    .prio-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .prio-dot.low    { background: #2ecc71; }
    .prio-dot.medium { background: #f1c40f; }
    .prio-dot.high   { background: #e94560; }

    /* task text */
    .task-text {
      flex: 1;
      color: rgba(255,255,255,0.85);
      font-size: 0.95rem;
      word-break: break-word;
      transition: color 0.2s;
      cursor: pointer;
      outline: none;
    }
    .task-item.done .task-text {
      text-decoration: line-through;
      color: rgba(255,255,255,0.35);
    }
    .task-text:focus {
      color: #fff;
      border-bottom: 1px dashed rgba(255,255,255,0.3);
    }

    /* date badge */
    .task-date {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.25);
      white-space: nowrap;
    }

    /* delete button */
    .btn-del {
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
      flex-shrink: 0;
    }
    .btn-del:hover { color: #e94560; background: rgba(233,69,96,0.12); }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .footer-info {
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
    }

    .btn-clear {
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 6px 14px;
      color: rgba(255,255,255,0.35);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-clear:hover {
      border-color: #e94560;
      color: #e94560;
      background: rgba(233,69,96,0.08);
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>📋 To-Do List</h1>
      <p id="dateLabel"></p>
    </div>
    <div class="stats" id="stats">0 / 0 done</div>
  </div>

  <!-- Input -->
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Add a new task…" maxlength="120" />
    <button class="btn-add" id="btnAdd" title="Add task">＋</button>
  </div>

  <!-- Priority -->
  <div class="priority-row">
    <label>Priority:</label>
    <button class="prio-btn active" data-prio="low">🟢 Low</button>
    <button class="prio-btn"        data-prio="medium">🟡 Medium</button>
    <button class="prio-btn"        data-prio="high">🔴 High</button>
  </div>

  <!-- Filter tabs -->
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn"        data-filter="active">Active</button>
    <button class="filter-btn"        data-filter="done">Done</button>
    <button class="filter-btn"        data-filter="high">🔴 High</button>
  </div>

  <!-- Task list -->
  <ul id="taskList"></ul>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-info" id="footerInfo">0 tasks remaining</span>
    <button class="btn-clear" id="btnClear">Clear completed</button>
  </div>

</div>

<script>
  /* ══════════════════════════════════════════
     State
  ══════════════════════════════════════════ */
  let tasks    = JSON.parse(localStorage.getItem('kiro_todos') || '[]');
  let filter   = 'all';
  let priority = 'low';

  /* ── DOM refs ── */
  const taskInput  = document.getElementById('taskInput');
  const btnAdd     = document.getElementById('btnAdd');
  const taskList   = document.getElementById('taskList');
  const statsEl    = document.getElementById('stats');
  const footerInfo = document.getElementById('footerInfo');
  const dateLabel  = document.getElementById('dateLabel');

  /* ── Date label ── */
  const now = new Date();
  dateLabel.textContent = now.toLocaleDateString('en-US', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  /* ══════════════════════════════════════════
     Priority selector
  ══════════════════════════════════════════ */
  document.querySelectorAll('.prio-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.prio-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      priority = btn.dataset.prio;
    });
  });

  /* ══════════════════════════════════════════
     Filter tabs
  ══════════════════════════════════════════ */
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  /* ══════════════════════════════════════════
     Add task
  ══════════════════════════════════════════ */
  function addTask() {
    const text = taskInput.value.trim();
    if (!text) {
      taskInput.focus();
      taskInput.style.borderColor = '#e94560';
      setTimeout(() => taskInput.style.borderColor = '', 800);
      return;
    }
    tasks.unshift({
      id:       Date.now(),
      text,
      done:     false,
      priority,
      created:  new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    });
    taskInput.value = '';
    taskInput.focus();
    save();
    render();
  }

  btnAdd.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  /* ══════════════════════════════════════════
     Toggle done
  ══════════════════════════════════════════ */
  function toggleDone(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
    save(); render();
  }

  /* ══════════════════════════════════════════
     Delete task
  ══════════════════════════════════════════ */
  function deleteTask(id) {
    const li = document.querySelector(`[data-id="${id}"]`);
    if (li) {
      li.style.transition = 'opacity 0.25s, transform 0.25s';
      li.style.opacity    = '0';
      li.style.transform  = 'translateX(20px)';
      setTimeout(() => {
        tasks = tasks.filter(t => t.id !== id);
        save(); render();
      }, 250);
    }
  }

  /* ══════════════════════════════════════════
     Edit task (click on text)
  ══════════════════════════════════════════ */
  function editTask(el, id) {
    el.contentEditable = 'true';
    el.focus();
    // place cursor at end
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    function save_edit() {
      el.contentEditable = 'false';
      const newText = el.textContent.trim();
      if (newText) {
        tasks = tasks.map(t => t.id === id ? { ...t, text: newText } : t);
        save();
      } else {
        el.textContent = tasks.find(t => t.id === id)?.text || '';
      }
    }
    el.addEventListener('blur',    save_edit, { once: true });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } }, { once: true });
  }

  /* ══════════════════════════════════════════
     Clear completed
  ══════════════════════════════════════════ */
  document.getElementById('btnClear').addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  });

  /* ══════════════════════════════════════════
     Save to localStorage
  ══════════════════════════════════════════ */
  function save() {
    localStorage.setItem('kiro_todos', JSON.stringify(tasks));
  }

  /* ══════════════════════════════════════════
     Render
  ══════════════════════════════════════════ */
  function render() {
    // filter
    let visible = tasks;
    if (filter === 'active') visible = tasks.filter(t => !t.done);
    if (filter === 'done')   visible = tasks.filter(t =>  t.done);
    if (filter === 'high')   visible = tasks.filter(t => t.priority === 'high');

    // stats
    const total = tasks.length;
    const done  = tasks.filter(t => t.done).length;
    statsEl.textContent     = `${done} / ${total} done`;
    const remaining          = tasks.filter(t => !t.done).length;
    footerInfo.textContent  = `${remaining} task${remaining !== 1 ? 's' : ''} remaining`;

    // build list
    if (visible.length === 0) {
      taskList.innerHTML = `
        <div class="empty-state">
          <div class="emoji">${filter === 'done' ? '🎉' : '📝'}</div>
          <p>${filter === 'done' ? 'No completed tasks yet!' : 'No tasks here. Add one above!'}</p>
        </div>`;
      return;
    }

    taskList.innerHTML = '';
    visible.forEach(task => {
      const li = document.createElement('li');
      li.className  = `task-item${task.done ? ' done' : ''}`;
      li.dataset.id = task.id;
      li.innerHTML  = `
        <div class="task-check" title="Mark done">${task.done ? '✓' : ''}</div>
        <div class="prio-dot ${task.priority}"></div>
        <span class="task-text" title="Click to edit">${escHtml(task.text)}</span>
        <span class="task-date">${task.created}</span>
        <button class="btn-del" title="Delete">🗑</button>
      `;

      li.querySelector('.task-check').addEventListener('click', () => toggleDone(task.id));
      li.querySelector('.btn-del').addEventListener('click',    () => deleteTask(task.id));
      li.querySelector('.task-text').addEventListener('dblclick', e => editTask(e.target, task.id));

      taskList.appendChild(li);
    });
  }

  /* ── XSS guard ── */
  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ── Initial render ── */
  render();
</script>

</body>
</html>
